<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groupie Tracker - Immersive Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Animated Background */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Main Container */
        .main-wrapper {
            position: relative;
            z-index: 1;
        }

        /* Hero Header */
        .hero-header {
            text-align: center;
            padding: 80px 20px 40px;
            position: relative;
        }

        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 6em;
            font-weight: 900;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff, #00ffff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            text-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
            letter-spacing: 8px;
            position: relative;
        }

        .hero-subtitle {
            font-size: 1.5em;
            color: #00ffff;
            margin-top: 20px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeInUp 1s ease 0.5s forwards;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Artist Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 50px;
            max-width: 1800px;
            margin: 60px auto;
            padding: 40px;
        }

        /* Artist Card - 3D Holographic Effect */
        .artist {
            position: relative;
            background: rgba(10, 10, 30, 0.6);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transform-style: preserve-3d;
            perspective: 1000px;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            border: 2px solid transparent;
        }

        .artist::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff, #00ffff);
            background-size: 400% 400%;
            border-radius: 20px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s;
            animation: gradientRotate 3s linear infinite;
        }

        .artist:hover::before {
            opacity: 1;
        }

        @keyframes gradientRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .artist:hover {
            transform: translateY(-20px) rotateX(5deg);
            box-shadow: 
                0 30px 80px rgba(255, 0, 255, 0.4),
                0 0 100px rgba(0, 255, 255, 0.3),
                inset 0 0 50px rgba(255, 0, 255, 0.1);
        }

        .artist-image-container {
            position: relative;
            overflow: hidden;
            height: 400px;
        }

        .artist img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            filter: brightness(0.8) contrast(1.2);
        }

        .artist:hover img {
            transform: scale(1.15) rotate(2deg);
            filter: brightness(1.1) contrast(1.3) saturate(1.5);
        }

        .artist-image-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.7s;
        }

        .artist:hover .artist-image-container::after {
            left: 100%;
        }

        .artist-info {
            padding: 30px;
            position: relative;
            background: linear-gradient(180deg, rgba(10, 10, 30, 0.95), rgba(20, 20, 50, 0.95));
        }

        .artist h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2em;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .artist button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: #000;
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        .artist button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .artist button:hover::before {
            width: 300px;
            height: 300px;
        }

        .artist button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.8), 0 0 60px rgba(0, 255, 255, 0.6);
        }

        /* Detail Container */
        .container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 60px;
            background: rgba(10, 10, 30, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 2px solid rgba(255, 0, 255, 0.3);
            box-shadow: 
                0 0 100px rgba(255, 0, 255, 0.3),
                0 0 200px rgba(0, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 0, 255, 0.1), transparent);
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container > * {
            position: relative;
            z-index: 1;
        }

        .container img {
            width: 100%;
            max-width: 700px;
            height: auto;
            border-radius: 20px;
            display: block;
            margin: 0 auto 40px;
            border: 3px solid rgba(255, 0, 255, 0.5);
            box-shadow: 
                0 0 50px rgba(255, 0, 255, 0.5),
                0 0 100px rgba(0, 255, 255, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .container h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 4em;
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
        }

        .container p {
            font-size: 1.3em;
            line-height: 1.8;
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(255, 0, 255, 0.05);
            border-left: 4px solid #ff00ff;
            border-radius: 10px;
            transition: all 0.3s;
        }

        .container p:hover {
            background: rgba(255, 0, 255, 0.1);
            transform: translateX(10px);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        .container strong {
            color: #00ffff;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .container a {
            display: inline-block;
            margin-top: 40px;
            padding: 18px 50px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            color: #000;
            text-decoration: none;
            border-radius: 50px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
            position: relative;
            overflow: hidden;
        }

        .container a:hover {
            transform: translateX(-10px) scale(1.05);
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.8), 0 0 80px rgba(0, 255, 255, 0.6);
        }

        /* Glitch Effect */
        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }

        .glitch::before {
            animation: glitch-1 2s infinite;
            color: #ff00ff;
            z-index: -1;
        }

        .glitch::after {
            animation: glitch-2 2s infinite;
            color: #00ffff;
            z-index: -2;
        }

        @keyframes glitch-1 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }

        @keyframes glitch-2 {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(2px, -2px); }
            40% { transform: translate(2px, 2px); }
            60% { transform: translate(-2px, -2px); }
            80% { transform: translate(-2px, 2px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero-title { font-size: 3em; letter-spacing: 3px; }
            .grid { grid-template-columns: 1fr; gap: 30px; padding: 20px; }
            .container { padding: 30px; margin: 30px 20px; }
            .container h1 { font-size: 2.5em; }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    
    <div class="main-wrapper">
        <div class="hero-header">
            <h1 class="hero-title glitch" data-text="GROUPIE TRACKER">GROUPIE TRACKER</h1>
            <p class="hero-subtitle">Explore the Universe of Music</p>
        </div>

        <!-- This is where your Go template data would render -->
        <div class="grid">
            <!-- Example card - replace with your Go template {{range .}} -->
            <div class="artist">
                <div class="artist-image-container">
                    <img src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=500" alt="Artist">
                </div>
                <div class="artist-info">
                    <h3>Artist Name</h3>
                    <form action="/artist" method="get">
                        <input type="hidden" name="id" value="1">
                        <button type="submit">Enter Experience</button>
                    </form>
                </div>
            </div>
            
            <div class="artist">
                <div class="artist-image-container">
                    <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500" alt="Artist">
                </div>
                <div class="artist-info">
                    <h3>Another Band</h3>
                    <form action="/artist" method="get">
                        <input type="hidden" name="id" value="2">
                        <button type="submit">Enter Experience</button>
                    </form>
                </div>
            </div>

            <div class="artist">
                <div class="artist-image-container">
                    <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500" alt="Artist">
                </div>
                <div class="artist-info">
                    <h3>Music Group</h3>
                    <form action="/artist" method="get">
                        <input type="hidden" name="id" value="3">
                        <button type="submit">Enter Experience</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Particle System
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 150;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = Math.random() * 2 - 1;
                this.speedY = Math.random() * 2 - 1;
                this.color = Math.random() > 0.5 ? '#ff00ff' : '#00ffff';
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
            }

            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function connectParticles() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 120) {
                        ctx.strokeStyle = `rgba(255, 0, 255, ${1 - distance / 120})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            connectParticles();
            requestAnimationFrame(animate);
        }

        init();
        animate();

        // Resize canvas
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Mouse interaction with particles
        canvas.addEventListener('mousemove', (e) => {
            const mouse = {
                x: e.x,
                y: e.y
            };

            particles.forEach(particle => {
                const dx = mouse.x - particle.x;
                const dy = mouse.y - particle.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < 100) {
                    particle.x -= dx / 20;
                    particle.y -= dy / 20;
                }
            });
        });

        // Add sound effect on button hover (optional)
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mouseenter', () => {
                button.style.animation = 'pulse 0.5s ease';
            });
            
            button.addEventListener('animationend', () => {
                button.style.animation = '';
            });
        });

        // 3D Card tilt effect
        document.querySelectorAll('.artist').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = (y - centerY) / 10;
                const rotateY = (centerX - x) / 10;
                
                card.style.transform = `translateY(-20px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
            });
            
            card.addEventListener('mouseleave', () => {
                card.style.transform = 'translateY(0) rotateX(0) rotateY(0) scale(1)';
            });
        });
    </script>
</body>
</html>
