<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover your favorite music artists and explore their concert schedules and tour dates">
    <title>Groupie Tracker - Discover Artists</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>
    <!-- Main Header -->
    <header class="main-header" role="banner">
        <div class="header-container">
            <div class="logo" aria-label="Groupie Tracker - Home">
                <svg width="32" height="32" viewBox="0 0 63 63" fill="none" aria-hidden="true">
                    <circle cx="31.5" cy="31.5" r="31.5" fill="#1DB954"/>
                    <path d="M13 31.5c0-10.2 8.3-18.5 18.5-18.5S50 21.3 50 31.5s-8.3 18.5-18.5 18.5S13 41.7 13 31.5zm25.5 0c0-3.9-3.1-7-7-7s-7 3.1-7 7 3.1 7 7 7 7-3.1 7-7z" fill="black"/>
                </svg>
                <span>Groupie Tracker</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="main-content" tabindex="-1">
        <!-- Artist Grid Section -->
        <section class="artist-grid-section" aria-labelledby="artists-title">
            <h1 id="artists-title" class="visually-hidden">Featured Artists</h1>
            
            <div class="artist-grid" role="list" aria-label="Artist list">
                {{range .}}
                <div role="listitem">
                    <a href="/artist/{{.ID}}" class="artist-card-link" aria-label="View details for {{.Name}}">
                        <article class="artist-card">
                            <div class="card-image-wrapper">
                                <img src="{{.Image}}" alt="{{.Name}}" class="card-image" loading="lazy">
                                <div class="card-overlay" aria-hidden="true"></div>
                            </div>
                            <div class="card-content">
                                <h2 class="card-title">{{.Name}}</h2>
                                <time class="card-year" datetime="{{.CreationDate}}">{{ .CreationDate }}</time>
                            </div>
                        </article>
                    </a>
                </div>
                {{end}}
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="main-footer" role="contentinfo">
        <p>&copy; 2026 Groupie Tracker. powred by ouaaitalla & achent</p>
    </footer>
</body>
</html>
