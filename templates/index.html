<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>groupie-tracker</title>
<!--     <link rel="stylesheet" href="/static/style.css">
 -->    <style>
        body { font-family: Arial; background: #f4f4f4; padding: 20px; }
        .grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .artist { background: #fff; border-radius: 5px; padding: 10px; width: 200px; text-align: center; box-shadow: 0 0 5px #ccc; }
        .artist img { width: 100%; border-radius: 5px; }
        button { margin-top: 10px; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>groupie-tracker</h1>
    <div class="grid">
        {{range .}}
        <div class="artist">
            <img src="{{.Image}}" >
            <h3>{{.Name}}</h3>
            <form action="/artist" method="get">
                <input type="hidden" name="id" value="{{.ID}}">
                <button type="submit">View Details</button>
            </form>
        </div>
        {{end}}
    </div>
<!--         <script src="/static/script.js"></script>
 --></body>
</html>
